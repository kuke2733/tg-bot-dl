<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Telegram 下载机器人</title>
  <style>
    :root {
      --bg: #0f172a;
      --bg-secondary: #1e293b;
      --band: #1e293b;
      --card: #334155;
      --ink: #f8fafc;
      --muted: #94a3b8;
      --line: rgba(148, 163, 184, 0.22);
      --line-strong: rgba(148, 163, 184, 0.32);
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-ink: #ffffff;
      --ok: #10b981;
      --wait: #f59e0b;
      --stop: #ef4444;
      --log-bg: #0a0f1a;
      --log-ink: #e2e8f0;
      --radius-sm: 10px;
      --radius: 14px;
      --radius-lg: 18px;
      --shadow: 0 8px 24px rgb(0 0 0 / 0.18);
      --shadow-lg: 0 16px 40px rgb(0 0 0 / 0.28);
      --focus: 0 0 0 3px rgb(59 130 246 / 0.16);
    }
    * { box-sizing: border-box; letter-spacing: 0; }
    html, body {
      margin: 0;
      padding: 0;
      background: radial-gradient(1200px 600px at 10% -10%, rgba(59, 130, 246, 0.12), transparent 55%),
                  radial-gradient(900px 500px at 100% 0%, rgba(99, 102, 241, 0.08), transparent 50%),
                  var(--bg);
      color: var(--ink);
      font: 14px/1.5 "Segoe UI", "Microsoft YaHei UI", sans-serif;
      height: 100%;
      overflow: hidden;
    }
    button, input { font: inherit; }
    input, button { border-radius: var(--radius-sm); transition: all 0.2s ease; }
    button:not(:disabled):hover { transform: translateY(-1px); }
    button:not(:disabled):active { transform: translateY(0); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header, section { width: 100%; }
    .inner { max-width: 1320px; margin: 0 auto; padding: 0 24px; width: 100%; }
    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
      gap: 20px;
      padding: 20px 24px 24px;
    }
    .left-panel, .right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
    }
    .right-panel {
      overflow-y: auto;
      gap: 16px;
    }
    header {
      background: rgba(30, 41, 59, 0.72);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 5;
      backdrop-filter: blur(14px);
    }
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 68px;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(135deg, #60a5fa 0%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .version {
      flex: none;
      padding: 2px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }
    .update-chip {
      flex: none;
      padding: 2px 8px;
      border: 1px solid rgba(245, 158, 11, 0.45);
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.14);
      color: #fbbf24;
      font-size: 12px;
      font-weight: 650;
      text-decoration: none;
    }
    .update-chip[hidden] { display: none; }
    h2 {
      margin: 0 0 18px;
      font-size: 15px;
      font-weight: 650;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 0.01em;
    }
    h2::before {
      content: "";
      width: 4px;
      height: 16px;
      background: linear-gradient(180deg, var(--accent) 0%, var(--accent-hover) 100%);
      border-radius: 999px;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 38px;
      padding: 0 14px;
      border: 1px solid var(--line);
      background: rgba(15, 23, 42, 0.55);
      border-radius: 999px;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 500;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #64748b;
      box-shadow: 0 0 0 0 currentColor;
      animation: pulse-idle 2s ease-in-out infinite;
    }
    @keyframes pulse-idle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    @keyframes pulse-active {
      0%, 100% { box-shadow: 0 0 0 0 currentColor; }
      50% { box-shadow: 0 0 0 4px transparent; }
    }
    .status.running .dot { background: var(--ok); animation: pulse-active 2s ease-in-out infinite; }
    .status.starting .dot, .status.waiting_code .dot, .status.waiting_password .dot { background: var(--wait); animation: pulse-active 1.5s ease-in-out infinite; }
    .status.exited .dot, .status.stopped .dot { background: var(--stop); animation: none; }
    .icon-btn, .primary, .ghost {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      min-width: 40px;
      padding: 0 16px;
      border: 1px solid var(--line);
      background: rgba(51, 65, 85, 0.7);
      color: var(--ink);
      cursor: pointer;
      font-weight: 500;
      border-radius: var(--radius-sm);
    }
    .icon-btn { width: 40px; padding: 0; border-radius: 12px; }
    .icon-btn:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); }
    .primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
      box-shadow: 0 6px 16px rgb(59 130 246 / 0.28);
      border-radius: 12px;
    }
    .primary:hover:not(:disabled) {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
      box-shadow: 0 8px 20px rgb(59 130 246 / 0.34);
    }
    .ghost { background: transparent; border-color: transparent; }
    .ghost:hover:not(:disabled) { background: var(--card); border-color: var(--line); }
    .icon-btn svg, .primary svg, .ghost svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .panel-card {
      background: rgba(30, 41, 59, 0.88);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }
    .form-card {
      background: rgba(30, 41, 59, 0.88);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px 20px 16px;
      box-shadow: var(--shadow);
    }
    .verify-hint {
      margin: -6px 0 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px 18px;
    }
    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 7px;
      font-weight: 500;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line-strong);
      background: rgba(15, 23, 42, 0.55);
      color: var(--ink);
      outline: none;
      border-radius: var(--radius-sm);
    }
    input[type="text"]:focus, input[type="password"]:focus {
      border-color: var(--accent);
      box-shadow: var(--focus);
      background: rgba(15, 23, 42, 0.78);
    }
    .password-field {
      position: relative;
    }
    .password-field input {
      padding-right: 44px;
    }
    .password-toggle {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 34px;
      height: 34px;
      padding: 0;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
    }
    .password-toggle:hover:not(:disabled) {
      color: var(--ink);
      background: rgba(148, 163, 184, 0.12);
      transform: translateY(-50%);
    }
    .password-toggle:active:not(:disabled) {
      transform: translateY(-50%);
    }
    .password-toggle svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .password-toggle .icon-hide { display: none; }
    .password-toggle.is-visible .icon-show { display: none; }
    .password-toggle.is-visible .icon-hide { display: block; }
    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--accent);
      border-radius: 6px;
    }
    .check {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 42px;
      margin-top: 24px;
      padding: 0 4px;
    }
    .hint { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
    .message { min-height: 20px; margin: 0; color: var(--muted); font-size: 13px; }
    .apply-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }
    .verify-band {
      display: none;
      background: rgba(30, 41, 59, 0.88);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px 20px 14px;
      box-shadow: var(--shadow);
    }
    .verify-band.show { display: block; }
    .verify-content {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .verify-content h2 {
      margin: 0 0 8px;
      font-size: 15px;
      font-weight: 650;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
    }
    .verify-content h2::before {
      content: "";
      width: 4px;
      height: 16px;
      background: linear-gradient(180deg, var(--accent) 0%, var(--accent-hover) 100%);
      border-radius: 999px;
    }
    .verify-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .verify-row label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin: 0;
      font-weight: 500;
    }
    .verify-actions {
      display: flex;
      align-items: stretch;
      gap: 10px;
    }
    .verify-actions .field {
      flex: 1;
      min-width: 0;
    }
    .verify-actions input {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      border: 1px solid var(--line-strong);
      background: rgba(15, 23, 42, 0.55);
      color: var(--ink);
      outline: none;
      border-radius: var(--radius-sm);
      transition: all 0.2s ease;
      font-size: 15px;
      font-weight: 600;
    }
    .verify-actions input[type="text"] {
      letter-spacing: 0.12em;
    }
    .verify-actions input::placeholder {
      letter-spacing: 0;
      font-weight: 400;
      color: #64748b;
    }
    .verify-actions input:focus {
      border-color: var(--accent);
      box-shadow: var(--focus);
      background: rgba(15, 23, 42, 0.78);
    }
    .verify-actions button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-shrink: 0;
      min-height: 44px;
      min-width: 96px;
      padding: 0 20px;
      background: var(--accent);
      border: 1px solid var(--accent);
      color: var(--accent-ink);
      box-shadow: 0 6px 16px rgb(59 130 246 / 0.28);
      cursor: pointer;
      font-weight: 600;
      border-radius: 12px;
      transition: all 0.2s ease;
    }
    .verify-actions button:hover:not(:disabled) {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
      box-shadow: 0 8px 20px rgb(59 130 246 / 0.34);
      transform: translateY(-1px);
    }
    .verify-actions button:active:not(:disabled) {
      transform: translateY(0);
    }
    .verify-msg {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 12px;
    }
    .verify-msg:empty { display: none; }
    .verify-msg.error { color: var(--stop); }
    .verify-msg.ok { color: var(--ok); }
    .log-card {
      background: rgba(30, 41, 59, 0.88);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }
    .log-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .log-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .log-status {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.35);
      border: 1px solid var(--line);
    }
    .log-status.paused { color: var(--wait); }
    .log-filter {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      padding: 4px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.35);
      border: 1px solid var(--line);
    }
    .filter-btn {
      padding: 4px 12px;
      font-size: 11px;
      min-height: 28px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn:hover { background: rgba(51, 65, 85, 0.7); color: var(--ink); }
    .filter-btn.active {
      border-color: transparent;
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 500;
      box-shadow: 0 4px 10px rgb(59 130 246 / 0.25);
    }
    .filter-btn.error.active { background: #ef4444; box-shadow: 0 4px 10px rgb(239 68 68 / 0.25); }
    .filter-btn.warning.active { background: #f59e0b; color: #0f172a; box-shadow: 0 4px 10px rgb(245 158 11 / 0.25); }
    .filter-btn.success.active { background: #10b981; box-shadow: 0 4px 10px rgb(16 185 129 / 0.25); }
    .filter-btn.info.active { background: #3b82f6; box-shadow: 0 4px 10px rgb(59 130 246 / 0.25); }
    .filter-btn.debug.active { background: #8b5cf6; box-shadow: 0 4px 10px rgb(139 92 246 / 0.25); }
    pre {
      margin: 0;
      flex: 1;
      overflow: auto;
      padding: 16px;
      background: var(--log-bg);
      color: var(--log-ink);
      font: 12px/1.45 Consolas, "Sarasa Mono SC", "Courier New", monospace;
      border-radius: var(--radius-sm);
      white-space: pre-wrap;
      word-break: break-word;
      border: 1px solid var(--line);
      box-shadow: inset 0 1px 3px rgb(0 0 0 / 0.28);
      user-select: text;
    }
    pre .log-line { display: block; margin: 2px 0; }
    pre .log-line.hidden { display: none; }
    pre .log-timestamp { color: #64748b; font-size: 11px; }
    pre .log-level { font-weight: 600; margin: 0 6px; display: inline-block; min-width: 60px; }
    pre .log-level.ERROR { color: #ef4444; }
    pre .log-level.WARNING { color: #f59e0b; }
    pre .log-level.SUCCESS { color: #10b981; }
    pre .log-level.INFO { color: #3b82f6; }
    pre .log-level.DEBUG { color: #8b5cf6; }
    pre::-webkit-scrollbar { width: 10px; height: 10px; }
    pre::-webkit-scrollbar-track { background: transparent; border-radius: 999px; }
    pre::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.28); border-radius: 999px; }
    pre::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.45); }
    .login {
      display: none;
      position: fixed;
      inset: 0;
      background: radial-gradient(900px 500px at 50% 20%, rgba(59, 130, 246, 0.16), transparent 60%), var(--bg);
      z-index: 10;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login.show { display: flex; }
    .login .box {
      width: min(420px, 92vw);
      background: rgba(30, 41, 59, 0.92);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 32px;
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(12px);
    }
    .login h1 {
      margin-bottom: 8px;
      background: linear-gradient(135deg, #60a5fa 0%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .login .hint { margin: 0 0 20px; }
    .login .apply-row { margin-top: 18px; }
    .wide { grid-column: 1 / -1; }
    @media (max-width: 1200px) {
      .main-container { flex-direction: column; overflow-y: auto; }
      .left-panel { flex: none; width: 100%; min-height: 420px; }
      .right-panel { width: 100%; overflow: visible; }
      .log-card { min-height: 400px; }
    }
    @media (max-width: 820px) {
      .main-container { padding: 16px; gap: 16px; }
      .grid { grid-template-columns: 1fr; }
      .header-row { flex-wrap: wrap; padding: 14px 0; }
      .check { margin-top: 0; }
      .form-card, .log-card, .verify-band { padding: 16px; }
      .log-header { flex-direction: column; align-items: flex-start; }
      .verify-actions { flex-direction: column; }
      .verify-actions button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="login" id="login">
    <div class="box">
      <h1>输入面板密码</h1>
      <p class="hint">这个页面受密码保护 · v{{ version }}</p>
      <label for="loginPassword">密码</label>
      <input id="loginPassword" type="password" />
      <div class="apply-row" style="border-top:none;padding-top:0;">
        <button class="primary" id="loginBtn" type="button">进入</button>
        <div class="message" id="loginMsg"></div>
      </div>
    </div>
  </div>

  <div class="app-container">
    <header>
      <div class="inner header-row">
        <div class="brand">
          <h1>Telegram 下载机器人</h1>
          <span class="version">v{{ version }}</span>
          <a class="update-chip" id="updateChip" hidden href="https://github.com/kuke2733/tg-bot-dl/releases/latest" target="_blank" rel="noopener">有新版本</a>
        </div>
        <div class="toolbar">
          <div class="status" id="statusPill"><span class="dot"></span><span id="statusText">未启动</span></div>
          <div class="actions">
            <button class="icon-btn" id="startBtn" type="button" title="启动">
              <svg viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>
            </button>
            <button class="icon-btn" id="stopBtn" type="button" title="停止">
              <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12"></rect></svg>
            </button>
            <button class="icon-btn" id="logoutBtn" type="button" title="退出登录" style="display:none">
              <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            </button>
          </div>
        </div>
      </div>
    </header>

    <div class="main-container">
      <!-- 左侧：日志区域 -->
      <div class="left-panel">
        <div class="log-card">
          <div class="log-header">
            <h2 style="margin:0">运行日志</h2>
            <div class="log-controls">
              <div class="log-filter">
                <button class="filter-btn active" data-level="ALL" type="button">全部</button>
                <button class="filter-btn error" data-level="ERROR" type="button">错误</button>
                <button class="filter-btn warning" data-level="WARNING" type="button">警告</button>
                <button class="filter-btn success" data-level="SUCCESS" type="button">成功</button>
                <button class="filter-btn info" data-level="INFO" type="button">信息</button>
                <button class="filter-btn debug" data-level="DEBUG" type="button">调试</button>
              </div>
              <div class="log-status" id="logStatus">
                <span>实时更新</span>
              </div>
            </div>
          </div>
          <pre id="logs">等待状态...</pre>
        </div>
      </div>

      <!-- 右侧：配置面板 -->
      <div class="right-panel">
        <div class="verify-band" id="verifyBand">
          <div class="verify-content">
            <h2 id="verifyTitle">需要验证</h2>
            <p class="verify-hint" id="verifyHint">机器人启动后需要完成 Telegram 登录验证</p>
            <div class="verify-row">
              <label for="verifyInput" id="verifyLabel">验证码</label>
              <div class="verify-actions">
                <div class="field">
                  <input id="verifyInput" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="请输入验证码" />
                </div>
                <button id="verifyBtn" type="button">提交</button>
              </div>
              <div class="verify-msg" id="verifyMsg"></div>
            </div>
          </div>
        </div>

        <div class="form-card">
          <h2>连接设置</h2>
          <form id="form">
            <div class="grid">
              <div>
                <label for="TELEGRAM_API_ID">API ID</label>
                <input id="TELEGRAM_API_ID" name="TELEGRAM_API_ID" type="text" autocomplete="off" />
              </div>
              <div>
                <label for="TELEGRAM_API_HASH">API Hash</label>
                <div class="password-field">
                  <input id="TELEGRAM_API_HASH" name="TELEGRAM_API_HASH" type="password" autocomplete="off" />
                  <button class="password-toggle" type="button" title="显示密码" aria-label="显示密码">
                    <svg class="icon-show" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    <svg class="icon-hide" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                  </button>
                </div>
              </div>
              <div class="wide">
                <label for="BOT_TOKEN">Bot Token</label>
                <div class="password-field">
                  <input id="BOT_TOKEN" name="BOT_TOKEN" type="password" autocomplete="off" />
                  <button class="password-toggle" type="button" title="显示密码" aria-label="显示密码">
                    <svg class="icon-show" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    <svg class="icon-hide" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                  </button>
                </div>
              </div>
              <div>
                <label for="ADMINS">管理员</label>
                <input id="ADMINS" name="ADMINS" type="text" placeholder="@username 或 123456789 或 @user1 987654321（空格分隔）" />
              </div>
              <div>
                <label for="PHONE_NUMBER">手机号</label>
                <input id="PHONE_NUMBER" name="PHONE_NUMBER" type="text" placeholder="+8613800000000" />
              </div>
              <div class="wide">
                <label for="PROXY">代理</label>
                <input id="PROXY" name="PROXY" type="text" placeholder="http://127.0.0.1:7890" />
                <p class="hint" id="proxyHint">本机代理可填 127.0.0.1，容器里会自动转到宿主机</p>
              </div>
              <div>
                <label for="WEB_PASSWORD">面板密码</label>
                <input id="WEB_PASSWORD" name="WEB_PASSWORD" type="password" autocomplete="new-password" />
              </div>
              <div class="check">
                <input id="DEBUG" name="DEBUG" type="checkbox" />
                <label for="DEBUG" style="margin:0;color:var(--ink)">开启调试日志</label>
              </div>
            </div>
            <div class="apply-row">
              <button class="primary" id="saveBtn" type="submit">
                <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                保存并生效
              </button>
              <div class="message" id="formMsg"></div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    const stateText = {
      stopped: "未启动",
      starting: "正在启动",
      running: "运行中",
      waiting_code: "等待验证码",
      waiting_password: "等待二次验证密码",
      exited: "已退出"
    };

    const fields = ["TELEGRAM_API_ID","TELEGRAM_API_HASH","BOT_TOKEN","ADMINS","PROXY","PHONE_NUMBER","WEB_PASSWORD"];
    let formDirty = false;
    let settingsLoaded = false;
    let logUpdatePaused = false;
    let pendingLogContent = null;
    let isAuthorized = false; // 记录授权状态，避免闪烁
    let currentLogFilter = "ALL"; // 当前日志筛选级别

    document.querySelectorAll(".password-field").forEach((wrap) => {
      const input = wrap.querySelector("input");
      const toggle = wrap.querySelector(".password-toggle");
      if (!input || !toggle) return;
      toggle.addEventListener("click", () => {
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        toggle.classList.toggle("is-visible", show);
        toggle.title = show ? "隐藏密码" : "显示密码";
        toggle.setAttribute("aria-label", toggle.title);
      });
    });

    // 检测用户是否正在选中日志内容
    function isTextSelected() {
      const selection = window.getSelection();
      if (!selection || selection.rangeCount === 0) return false;
      const range = selection.getRangeAt(0);
      const logsElement = document.getElementById("logs");
      return logsElement && logsElement.contains(range.commonAncestorContainer) && !range.collapsed;
    }

    // 监听选择变化
    document.addEventListener("selectionchange", () => {
      const wasSelected = logUpdatePaused;
      logUpdatePaused = isTextSelected();

      const statusEl = document.getElementById("logStatus");
      if (logUpdatePaused) {
        statusEl.classList.add("paused");
        statusEl.innerHTML = '<span>⏸</span><span>已暂停更新（选中文本时）</span>';
      } else {
        statusEl.classList.remove("paused");
        statusEl.innerHTML = '<span>实时更新</span>';

        // 恢复更新时，如果有待更新的内容就立即更新（会经过 updateLogs 格式化）
        if (wasSelected && pendingLogContent !== null) {
          updateLogs(pendingLogContent);
          pendingLogContent = null;
        }
      }
    });

    async function api(url, options) {
      const res = await fetch(url, Object.assign({ headers: { "Content-Type": "application/json" } }, options));
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.message || "请求失败");
      return data;
    }

    function fillSettings(settings, force) {
      if (!settings) return;
      if (!force && formDirty) return;
      fields.forEach((key) => {
        const el = document.getElementById(key);
        if (el) el.value = settings[key] || "";
      });
      document.getElementById("DEBUG").checked = settings.DEBUG === "1";
      settingsLoaded = true;
      if (force) formDirty = false;
    }

    function updateLogs(newContent) {
      if (logUpdatePaused) {
        // 用户正在选中文本，暂存内容不更新
        pendingLogContent = newContent;
      } else {
        // 解析并格式化日志
        const logsEl = document.getElementById("logs");
        const shouldScrollToBottom = logsEl.scrollHeight - logsEl.scrollTop - logsEl.clientHeight < 50;

        // 将日志按行解析并添加颜色
        const lines = newContent.split('\n');
        const formatted = lines.map(line => {
          if (!line.trim()) return ''; // 跳过空行
          // 匹配格式: [2024-01-01 12:00:00] [LEVEL] message
          const match = line.match(/^(\[[\d\-: ]+\])\s*(\[(ERROR|WARNING|SUCCESS|INFO|DEBUG)\])\s*(.*)$/);
          if (match) {
            const timestamp = match[1];
            const level = match[3];
            const message = match[4];
            const hidden = (currentLogFilter !== "ALL" && currentLogFilter !== level) ? ' hidden' : '';
            return `<span class="log-line${hidden}" data-level="${level}"><span class="log-timestamp">${timestamp}</span><span class="log-level ${level}">[${level}]</span>${message}</span>`;
          }
          return `<span class="log-line">${line}</span>`;
        }).filter(line => line).join(''); // 用空字符串连接，不加换行

        logsEl.innerHTML = formatted;

        if (shouldScrollToBottom) {
          logsEl.scrollTop = logsEl.scrollHeight;
        }
      }
    }

    function applyLogFilter(level) {
      currentLogFilter = level;
      const logsEl = document.getElementById("logs");
      const lines = logsEl.querySelectorAll('.log-line');

      lines.forEach(line => {
        const lineLevel = line.getAttribute('data-level');
        if (level === "ALL" || lineLevel === level) {
          line.classList.remove('hidden');
        } else {
          line.classList.add('hidden');
        }
      });

      // 更新按钮状态
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.getAttribute('data-level') === level) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }

    function render(data, options) {
      options = options || {};

      // 只有在明确未授权时才显示登录界面，避免闪烁
      if (data.authorized === false) {
        document.getElementById("login").classList.add("show");
        isAuthorized = false;
        settingsLoaded = false;
        formDirty = false;
        return;
      }

      // 如果已授权或授权状态未知但之前已授权，则隐藏登录界面
      if (data.authorized === true || isAuthorized) {
        isAuthorized = true;
        document.getElementById("login").classList.remove("show");
      }

      document.getElementById("logoutBtn").style.display = data.has_password ? "inline-flex" : "none";
      fillSettings(data.settings, options.forceSettings === true || !settingsLoaded);
      const pill = document.getElementById("statusPill");
      pill.className = "status " + (data.state || "stopped");
      const label = stateText[data.state] || data.state || "未启动";
      document.getElementById("statusText").textContent = data.bot_username ? (label + " " + data.bot_username) : label;

      // 使用智能日志更新
      updateLogs(data.logs || "暂无日志");

      const verify = document.getElementById("verifyBand");
      const verifyInput = document.getElementById("verifyInput");
      if (data.state === "waiting_code" || data.state === "waiting_password") {
        const isPassword = data.state === "waiting_password";
        verify.classList.add("show");
        document.getElementById("verifyTitle").textContent = data.waiting_prompt || "需要验证";
        document.getElementById("verifyLabel").textContent = isPassword ? "二次验证密码" : "验证码";
        document.getElementById("verifyHint").textContent = isPassword
          ? "账号已开启两步验证，请输入云密码以继续登录"
          : "请查收 Telegram 发来的登录验证码，输入后提交";
        verifyInput.type = isPassword ? "password" : "text";
        verifyInput.inputMode = isPassword ? "text" : "numeric";
        verifyInput.autocomplete = isPassword ? "current-password" : "one-time-code";
        verifyInput.placeholder = isPassword ? "请输入二次验证密码" : "请输入验证码";
      } else {
        verify.classList.remove("show");
      }

      renderUpdate(data);
    }

    function renderUpdate(data) {
      const update = data && data.update;
      const chip = document.getElementById("updateChip");
      if (!update || !update.has_update || !update.latest) {
        chip.hidden = true;
        return;
      }
      chip.hidden = false;
      chip.textContent = "有新版本 v" + update.latest;
      chip.href = update.url || "https://github.com/kuke2733/tg-bot-dl/releases/latest";
    }

    async function refresh() {
      try {
        render(await api("/api/status"));
      } catch (err) {
        document.getElementById("formMsg").textContent = err.message;
      }
    }

    document.getElementById("form").addEventListener("input", () => { formDirty = true; });
    document.getElementById("form").addEventListener("change", () => { formDirty = true; });

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {};
      fields.forEach((key) => payload[key] = document.getElementById(key).value);
      payload.DEBUG = document.getElementById("DEBUG").checked;
      try {
        const data = await api("/api/settings", { method: "POST", body: JSON.stringify(payload) });
        document.getElementById("formMsg").textContent = data.message || "已保存";
        render(data, { forceSettings: true });
      } catch (err) {
        document.getElementById("formMsg").textContent = err.message;
      }
    });

    document.getElementById("startBtn").addEventListener("click", async () => {
      try { render(await api("/api/start", { method: "POST", body: "{}" })); }
      catch (err) { document.getElementById("formMsg").textContent = err.message; }
    });
    document.getElementById("stopBtn").addEventListener("click", async () => {
      try { render(await api("/api/stop", { method: "POST", body: "{}" })); }
      catch (err) { document.getElementById("formMsg").textContent = err.message; }
    });
    document.getElementById("verifyBtn").addEventListener("click", async () => {
      const text = document.getElementById("verifyInput").value;
      const verifyMsg = document.getElementById("verifyMsg");
      verifyMsg.className = "verify-msg";
      try {
        const data = await api("/api/input", { method: "POST", body: JSON.stringify({ text }) });
        document.getElementById("verifyInput").value = "";
        verifyMsg.textContent = data.message || "已提交";
        verifyMsg.classList.add("ok");
        render(data);
      } catch (err) {
        verifyMsg.textContent = err.message;
        verifyMsg.classList.add("error");
      }
    });
    document.getElementById("loginBtn").addEventListener("click", async () => {
      try {
        await api("/api/login", { method: "POST", body: JSON.stringify({ password: document.getElementById("loginPassword").value }) });
        document.getElementById("loginMsg").textContent = "";
        refresh();
      } catch (err) {
        document.getElementById("loginMsg").textContent = err.message;
      }
    });

    document.getElementById("loginPassword").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("loginBtn").click();
    });
    document.getElementById("verifyInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("verifyBtn").click();
    });
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      try { await api("/api/logout", { method: "POST", body: "{}" }); refresh(); }
      catch (err) { document.getElementById("formMsg").textContent = err.message; }
    });

    // 日志筛选按钮
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const level = btn.getAttribute('data-level');
        applyLogFilter(level);
      });
    });

    async function checkUpdate() {
      try {
        const data = await api("/api/update");
        renderUpdate(data);
      } catch (err) {}
    }

    refresh();
    checkUpdate();
    setInterval(refresh, 1500);
    setInterval(checkUpdate, 30 * 60 * 1000);
  </script>
</body>
</html>
