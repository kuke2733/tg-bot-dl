<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eef2f7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>TG下载机器人</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}" />
  <style>
    :root {
      --bg: #eef2f7;
      --surface: var(--bg);
      --card: var(--bg);
      --ink: #1e293b;
      --muted: #64748b;
      --line: rgba(30, 41, 59, 0.06);
      --accent: #3b82f6;
      --accent-ink: #ffffff;
      --ok: #059669;
      --wait: #d97706;
      --stop: #dc2626;
      --log-bg: var(--bg);
      --log-ink: var(--ink);
      --radius-sm: 12px;
      --radius: 16px;
      --neu-light: #ffffff;
      --neu-dark: #e0e6ef;
      --shadow-out:
        3px 3px 8px var(--neu-dark),
        -3px -3px 8px var(--neu-light);
      --shadow-out-sm:
        2px 2px 5px var(--neu-dark),
        -2px -2px 5px var(--neu-light);
      --shadow-in:
        inset 1.5px 1.5px 4px var(--neu-dark),
        inset -1.5px -1.5px 4px var(--neu-light);
      --shadow-in-sm:
        inset 1px 1px 3px var(--neu-dark),
        inset -1px -1px 3px var(--neu-light);
      --shadow-lg: 4px 4px 12px var(--neu-dark), -4px -4px 12px var(--neu-light);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --mobile-nav-h: 64px;
      --scroll-thumb: rgba(148, 163, 184, 0.28);
      --scroll-thumb-hover: rgba(148, 163, 184, 0.45);
      --header-shadow: 0 1px 6px rgba(148, 163, 184, 0.14);
      --nav-shadow: 0 -1px 6px rgba(148, 163, 184, 0.14);
    }
    * {
      box-sizing: border-box;
      letter-spacing: 0;
      scrollbar-width: thin;
      scrollbar-color: rgba(148, 163, 184, 0.35) transparent;
    }
    *::-webkit-scrollbar { width: 8px; height: 8px; }
    *::-webkit-scrollbar-track,
    *::-webkit-scrollbar-corner { background: transparent; }
    *::-webkit-scrollbar-thumb {
      background-color: var(--scroll-thumb);
      border-radius: 999px;
      border: 2px solid transparent;
      background-clip: content-box;
    }
    *::-webkit-scrollbar-thumb:hover { background-color: var(--scroll-thumb-hover); }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.5 "Segoe UI", "Microsoft YaHei UI", sans-serif;
      height: 100%;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    button, input {
      font: inherit;
      border-radius: var(--radius-sm);
    }
    button {
      -webkit-tap-highlight-color: transparent;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .mobile-nav,
    .mobile-verify-tip { display: none; }
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: var(--bg);
    }
    header { width: 100%; }
    .inner { max-width: 1320px; margin: 0 auto; padding: 0 24px; width: 100%; }
    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
      gap: 20px;
      padding: 20px 24px 24px;
    }
    .left-panel, .right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
      padding: 10px;
    }
    .right-panel {
      overflow-y: auto;
      gap: 16px;
    }
    header {
      background: var(--bg);
      box-shadow: var(--header-shadow);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 68px;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    h1 {
      margin: 0;
      display: flex;
      align-items: center;
      min-width: 0;
    }
    .brand-title-full {
      display: inline-flex;
      align-items: center;
      height: 40px;
      padding: 0 14px;
      border-radius: var(--radius-sm);
      background: var(--surface);
      box-shadow: var(--shadow-out-sm);
    }
    .brand-mark {
      color: var(--accent);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.04em;
    }
    .brand-title-text {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-sm);
      flex: none;
      object-fit: cover;
      box-shadow: var(--shadow-out-sm);
    }
    header .brand-logo {
      display: none;
    }
    .version,
    .update-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: none;
      height: 40px;
      padding: 0 12px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      box-sizing: border-box;
      background: var(--surface);
      box-shadow: var(--shadow-out-sm);
    }
    .version {
      color: var(--muted);
    }
    .update-chip {
      color: var(--wait);
      text-decoration: none;
    }
    .update-chip[hidden] { display: none; }
    /* 有更新时隐藏版本号，避免并排重复 */
    .brand:has(#updateChip:not([hidden])) .version {
      display: none;
    }
    h2 {
      margin: 0 0 18px;
      font-size: 15px;
      font-weight: 650;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 0.01em;
      color: var(--ink);
    }
    h2::before {
      content: "";
      width: 4px;
      height: 16px;
      background: var(--accent);
      border-radius: var(--radius-sm);
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      height: 40px;
      min-height: 40px;
      padding: 0 14px;
      background: var(--surface);
      border-radius: var(--radius-sm);
      white-space: nowrap;
      font-size: 13px;
      font-weight: 500;
      box-sizing: border-box;
      box-shadow: var(--shadow-out-sm);
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #64748b;
      box-shadow: 0 0 0 0 currentColor;
      animation: pulse-idle 2s ease-in-out infinite;
    }
    @keyframes pulse-idle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    @keyframes pulse-active {
      0%, 100% { box-shadow: 0 0 0 0 currentColor; }
      50% { box-shadow: 0 0 0 4px transparent; }
    }
    .status.running .dot { background: var(--ok); animation: pulse-active 2s ease-in-out infinite; }
    .status.starting .dot, .status.waiting_code .dot, .status.waiting_password .dot { background: var(--wait); animation: pulse-active 1.5s ease-in-out infinite; }
    .status.exited .dot, .status.stopped .dot { background: var(--stop); animation: none; }
    .icon-btn, .primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      min-width: 40px;
      padding: 0 16px;
      border: none;
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      font-weight: 500;
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-out-sm);
    }
    .icon-btn { width: 40px; padding: 0; }
    .primary {
      background: var(--accent);
      color: var(--accent-ink);
    }
    .icon-btn svg, .primary svg, .password-toggle svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .form-card,
    .verify-band,
    .log-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow-out);
    }
    .form-card {
      padding: 20px 20px 16px;
    }
    .verify-hint {
      margin: -6px 0 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px 18px;
    }
    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 7px;
      font-weight: 500;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      height: 42px;
      padding: 0 14px;
      border: none;
      background: var(--surface);
      color: var(--ink);
      outline: none;
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-in);
    }
    input[type="text"]:focus, input[type="password"]:focus {
      box-shadow: var(--shadow-in), 0 0 0 1px rgba(59, 130, 246, 0.28);
    }
    .password-field {
      position: relative;
    }
    .password-field input {
      padding-right: 44px;
    }
    .password-toggle {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 34px;
      height: 34px;
      padding: 0;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
    }
    .password-toggle .icon-hide { display: none; }
    .password-toggle.is-visible .icon-show { display: none; }
    .password-toggle.is-visible .icon-hide { display: block; }
    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--accent);
      border-radius: var(--radius-sm);
    }
    .check {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 42px;
      margin-top: 24px;
      padding: 0 4px;
    }
    .check label {
      margin: 0;
      color: var(--ink);
    }
    .hint { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
    .message { min-height: 20px; margin: 0; color: var(--muted); font-size: 13px; }
    .apply-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }
    .verify-band {
      display: none;
      padding: 20px 20px 14px;
    }
    .verify-band.show { display: block; }
    .verify-content {
      display: flex;
      flex-direction: column;
    }
    .verify-content h2 {
      margin: 0 0 8px;
    }
    .verify-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .verify-row label {
      margin: 0;
    }
    .verify-actions {
      display: flex;
      align-items: stretch;
      gap: 10px;
    }
    .verify-actions .field {
      flex: 1;
      min-width: 0;
    }
    .verify-actions input {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      border: none;
      background: var(--surface);
      color: var(--ink);
      outline: none;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 600;
      box-shadow: var(--shadow-in);
    }
    .verify-actions input[type="text"] {
      letter-spacing: 0.12em;
    }
    .verify-actions input::placeholder {
      letter-spacing: 0;
      font-weight: 400;
      color: #94a3b8;
    }
    .verify-actions input:focus {
      box-shadow: var(--shadow-in), 0 0 0 1px rgba(59, 130, 246, 0.28);
    }
    .verify-actions button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-shrink: 0;
      min-height: 44px;
      min-width: 96px;
      padding: 0 20px;
      background: var(--accent);
      border: none;
      color: var(--accent-ink);
      box-shadow: var(--shadow-out-sm);
      cursor: pointer;
      font-weight: 600;
      border-radius: var(--radius-sm);
    }
    .verify-msg {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 12px;
    }
    .verify-msg:empty { display: none; }
    .verify-msg.error { color: var(--stop); }
    .verify-msg.ok { color: var(--ok); }
    .log-card {
      padding: 18px;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }
    .log-card > pre {
      min-height: 0;
      flex: 1 1 auto;
      height: 0;
    }
    .log-header {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .log-header > h2 {
      margin: 0;
      margin-right: auto;
    }
    .log-status {
      order: 2;
      font-size: 12px;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 36px;
      min-height: 36px;
      padding: 0 12px;
      border-radius: var(--radius-sm);
      background: var(--surface);
      box-sizing: border-box;
      white-space: nowrap;
      box-shadow: var(--shadow-out-sm);
    }
    .log-status.paused { color: var(--wait); }
    .log-filter {
      order: 1;
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      min-height: 36px;
      padding: 4px;
      border-radius: var(--radius-sm);
      background: var(--surface);
      box-sizing: border-box;
      box-shadow: var(--shadow-in-sm);
    }
    .filter-btn {
      padding: 4px 12px;
      font-size: 11px;
      min-height: 28px;
      border-radius: calc(var(--radius-sm) - 2px);
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .filter-btn.active {
      background: var(--surface);
      color: var(--ink);
      font-weight: 600;
      box-shadow: var(--shadow-out-sm);
    }
    .filter-btn.error.active { color: var(--stop); }
    .filter-btn.warning.active { color: var(--wait); }
    .filter-btn.success.active { color: var(--ok); }
    .filter-btn.info.active { color: var(--accent); }
    .filter-btn.debug.active { color: #7c3aed; }
    pre {
      margin: 0;
      flex: 1;
      overflow: auto;
      padding: 14px;
      background: var(--log-bg);
      color: var(--log-ink);
      font: 500 13px/1.5 Consolas, "Sarasa Mono SC", "Cascadia Mono", "Courier New", monospace;
      border-radius: var(--radius-sm);
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: var(--shadow-in);
      user-select: text;
    }
    pre .log-line { display: block; margin: 2px 0; }
    pre .log-line.hidden { display: none; }
    pre .log-meta,
    pre .log-msg { display: inline; }
    pre .log-msg { font-weight: 500; }
    pre .log-timestamp { color: #475569; font-size: 12px; font-weight: 500; }
    pre .log-level { font-weight: 700; margin: 0 6px; display: inline-block; min-width: 60px; }
    pre .log-level.ERROR { color: var(--stop); }
    pre .log-level.WARNING { color: var(--wait); }
    pre .log-level.SUCCESS { color: var(--ok); }
    pre .log-level.INFO { color: var(--accent); }
    pre .log-level.DEBUG { color: #7c3aed; }
    .login {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 10;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login.show { display: flex; }
    .login .box {
      width: min(420px, 92vw);
      background: var(--card);
      border-radius: var(--radius);
      padding: 32px;
      box-shadow: var(--shadow-lg);
    }
    .login h1 {
      margin-bottom: 8px;
      color: var(--ink);
    }
    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    .login-brand .brand-logo {
      width: 64px;
      height: 64px;
      border-radius: var(--radius);
      box-shadow: var(--shadow-out);
    }
    .login .hint { margin: 0 0 20px; }
    .login .apply-row {
      margin-top: 18px;
      border-top: none;
      padding-top: 0;
    }
    .wide { grid-column: 1 / -1; }
    @media (max-width: 1200px) {
      .main-container { flex-direction: column; overflow-y: auto; }
      .left-panel { flex: none; width: 100%; min-height: 420px; }
      .right-panel { width: 100%; overflow: visible; }
      .log-card { min-height: 400px; }
    }
    @media (max-width: 820px) {
      .main-container { padding: 16px; gap: 16px; }
      .grid { grid-template-columns: 1fr; }
      .header-row { flex-wrap: wrap; padding-top: 14px; padding-bottom: 14px; }
      .check { margin-top: 0; }
      .form-card, .log-card, .verify-band { padding: 16px; }
      .verify-actions { flex-direction: column; }
      .verify-actions button { width: 100%; }
    }
    /* —— 手机端：底部分区 + 紧凑顶栏 —— */
    @media (max-width: 768px) {
      html, body {
        height: 100dvh;
        overflow: hidden;
      }
      .app-container {
        height: 100dvh;
        padding-left: var(--safe-left);
        padding-right: var(--safe-right);
      }
      .inner {
        padding: 0;
      }
      header {
        padding: var(--safe-top) 16px 0;
      }
      .header-row {
        min-height: 56px;
        gap: 12px;
        padding: 10px 0;
        flex-wrap: nowrap;
      }
      .brand {
        flex: none;
        min-width: 0;
      }
      header .brand-logo { display: block; }
      h1 { display: none; }
      .toolbar {
        gap: 10px;
        flex: none;
        margin-left: auto;
      }
      .status {
        padding: 0 12px;
        gap: 8px;
        flex: none;
      }
      .status #statusText { white-space: nowrap; }
      .icon-btn {
        width: 40px;
        min-width: 40px;
        min-height: 40px;
      }
      .main-container {
        flex-direction: column;
        flex: 1;
        min-height: 0;
        overflow: hidden;
        padding: 8px 8px calc(var(--mobile-nav-h) + var(--safe-bottom) + 8px);
        gap: 0;
      }
      .left-panel,
      .right-panel {
        display: none;
        flex: 1;
        min-height: 0;
        width: 100%;
        overflow: hidden;
        padding: 8px;
      }
      .app-container[data-panel="logs"] .left-panel {
        display: flex;
      }
      .app-container[data-panel="settings"] .right-panel {
        display: flex;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
        gap: 12px;
        padding-bottom: 4px;
      }
      .log-card {
        min-height: 0;
        height: 100%;
        padding: 14px;
        border-radius: var(--radius);
        overflow: hidden;
      }
      .log-header {
        display: grid;
        grid-template-columns: 1fr auto;
        grid-template-areas:
          "title status"
          "filter filter";
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      .log-header > h2 {
        grid-area: title;
        margin-right: 0;
      }
      .log-status {
        grid-area: status;
        order: unset;
        height: 32px;
        min-height: 32px;
        padding: 0 10px;
        font-size: 12px;
      }
      .log-filter {
        grid-area: filter;
        order: unset;
        width: 100%;
        flex-wrap: nowrap;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .log-filter::-webkit-scrollbar { display: none; }
      .filter-btn {
        flex: none;
        min-height: 32px;
        padding: 6px 12px;
        font-size: 12px;
      }
      pre {
        font-size: 12px;
        padding: 12px;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
      }
      pre .log-level { min-width: 52px; margin: 0 4px 0 0; }
      pre .log-line {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        margin: 8px 0;
      }
      pre .log-meta {
        display: flex;
        align-items: baseline;
        gap: 6px;
        flex-wrap: nowrap;
      }
      pre .log-msg {
        display: block;
        width: 100%;
        word-break: break-word;
      }
      .form-card,
      .verify-band {
        padding: 16px;
        border-radius: var(--radius);
        flex: none;
      }
      .grid { grid-template-columns: 1fr; gap: 14px; }
      .check { margin-top: 0; height: auto; min-height: 42px; }
      input[type="text"],
      input[type="password"],
      .verify-actions input {
        font-size: 16px;
        min-height: 44px;
      }
      .apply-row {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }
      .apply-row .primary {
        width: 100%;
        min-height: 46px;
      }
      .verify-actions { flex-direction: column; }
      .verify-actions button {
        width: 100%;
        min-height: 46px;
      }
      .mobile-verify-tip {
        display: none;
        margin: 0 12px 0;
        padding: 10px 12px;
        border: none;
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--wait);
        font-size: 13px;
        font-weight: 600;
        box-shadow: var(--shadow-out-sm);
      }
      .app-container[data-panel="logs"].needs-verify .mobile-verify-tip {
        display: block;
        margin-bottom: 10px;
      }
      .mobile-nav {
        display: grid;
        grid-template-columns: 1fr 1fr;
        position: fixed;
        left: var(--safe-left);
        right: var(--safe-right);
        bottom: 0;
        z-index: 8;
        height: calc(var(--mobile-nav-h) + var(--safe-bottom));
        padding: 8px 12px var(--safe-bottom);
        gap: 8px;
        background: var(--bg);
        border-top: none;
        box-shadow: var(--nav-shadow);
      }
      .mobile-nav button {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        min-height: 48px;
        border: none;
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: var(--shadow-out-sm);
      }
      .mobile-nav button svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .mobile-nav button.active {
        color: var(--accent);
        background: var(--surface);
        box-shadow: var(--shadow-in-sm);
      }
      .mobile-nav button .nav-badge {
        position: absolute;
        top: 8px;
        right: calc(50% - 28px);
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--wait);
        box-shadow: 0 0 0 2px var(--bg);
      }
      .mobile-nav .nav-item {
        position: relative;
      }
      .login {
        padding: max(16px, var(--safe-top)) 16px max(16px, var(--safe-bottom));
        align-items: flex-start;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      .login .box {
        width: min(420px, 100%);
        margin: auto;
        padding: 24px 20px;
      }
      .login .apply-row {
        flex-direction: column;
        align-items: stretch;
      }
      .login .primary {
        width: 100%;
        min-height: 46px;
      }
    }
    @media (max-width: 380px) {
      .status { display: none; }
      .update-chip { display: none; }
    }
  </style>
</head>
<body>
  <div class="login" id="login">
    <div class="box">
      <div class="login-brand">
        <img class="brand-logo" src="{{ url_for('static', filename='logo.png') }}" alt="Logo" />
        <h1>输入面板密码</h1>
      </div>
      <p class="hint">这个页面受密码保护 · v{{ version }}</p>
      <label for="loginPassword">密码</label>
      <input id="loginPassword" type="password" />
      <div class="apply-row">
        <button class="primary" id="loginBtn" type="button">进入</button>
        <div class="message" id="loginMsg"></div>
      </div>
    </div>
  </div>

  <div class="app-container" id="app" data-panel="logs">
    <header>
      <div class="inner header-row">
        <div class="brand">
          <img class="brand-logo" src="{{ url_for('static', filename='logo.png') }}" alt="Logo" />
          <h1>
            <span class="brand-title-full"><span class="brand-mark">TG</span><span class="brand-title-text">下载机器人</span></span>
          </h1>
          <span class="version">v{{ version }}</span>
          <a class="update-chip" id="updateChip" hidden href="https://github.com/kuke2733/tg-bot-dl/releases/latest" target="_blank" rel="noopener">有新版本</a>
        </div>
        <div class="toolbar">
          <div class="status" id="statusPill"><span class="dot"></span><span id="statusText">未启动</span></div>
          <div class="actions">
            <button class="icon-btn" id="startBtn" type="button" title="启动" aria-label="启动">
              <svg viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>
            </button>
            <button class="icon-btn" id="stopBtn" type="button" title="停止" aria-label="停止">
              <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12"></rect></svg>
            </button>
            <button class="icon-btn" id="logoutBtn" type="button" title="退出登录" aria-label="退出登录" style="display:none">
              <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            </button>
          </div>
        </div>
      </div>
    </header>

    <button class="mobile-verify-tip" id="mobileVerifyTip" type="button">需要验证码，点此前往设置</button>

    <div class="main-container">
      <div class="left-panel" id="logsPanel">
        <div class="log-card">
          <div class="log-header">
            <h2>运行日志</h2>
            <div class="log-status" id="logStatus">
              <span>实时更新</span>
            </div>
            <div class="log-filter">
              <button class="filter-btn active" data-level="ALL" type="button">全部</button>
              <button class="filter-btn error" data-level="ERROR" type="button">错误</button>
              <button class="filter-btn warning" data-level="WARNING" type="button">警告</button>
              <button class="filter-btn success" data-level="SUCCESS" type="button">成功</button>
              <button class="filter-btn info" data-level="INFO" type="button">信息</button>
              <button class="filter-btn debug" data-level="DEBUG" type="button">调试</button>
            </div>
          </div>
          <pre id="logs">等待状态...</pre>
        </div>
      </div>

      <div class="right-panel" id="settingsPanel">
        <div class="verify-band" id="verifyBand">
          <div class="verify-content">
            <h2 id="verifyTitle">需要验证</h2>
            <p class="verify-hint" id="verifyHint">机器人启动后需要完成 Telegram 登录验证</p>
            <div class="verify-row">
              <label for="verifyInput" id="verifyLabel">验证码</label>
              <div class="verify-actions">
                <div class="field">
                  <input id="verifyInput" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="请输入验证码" />
                </div>
                <button id="verifyBtn" type="button">提交</button>
              </div>
              <div class="verify-msg" id="verifyMsg"></div>
            </div>
          </div>
        </div>

        <div class="form-card">
          <h2>连接设置</h2>
          <form id="form">
            <div class="grid">
              <div>
                <label for="TELEGRAM_API_ID">API ID</label>
                <input id="TELEGRAM_API_ID" name="TELEGRAM_API_ID" type="text" autocomplete="off" />
              </div>
              <div>
                <label for="TELEGRAM_API_HASH">API Hash</label>
                <div class="password-field">
                  <input id="TELEGRAM_API_HASH" name="TELEGRAM_API_HASH" type="password" autocomplete="off" />
                  <button class="password-toggle" type="button" title="显示密码" aria-label="显示密码">
                    <svg class="icon-show" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    <svg class="icon-hide" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                  </button>
                </div>
              </div>
              <div class="wide">
                <label for="BOT_TOKEN">Bot Token</label>
                <div class="password-field">
                  <input id="BOT_TOKEN" name="BOT_TOKEN" type="password" autocomplete="off" />
                  <button class="password-toggle" type="button" title="显示密码" aria-label="显示密码">
                    <svg class="icon-show" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    <svg class="icon-hide" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                  </button>
                </div>
              </div>
              <div>
                <label for="ADMINS">管理员</label>
                <input id="ADMINS" name="ADMINS" type="text" placeholder="@username 或 123456789 或 @user1 987654321（空格分隔）" />
              </div>
              <div>
                <label for="PHONE_NUMBER">手机号</label>
                <input id="PHONE_NUMBER" name="PHONE_NUMBER" type="text" inputmode="tel" placeholder="+8613800000000" />
              </div>
              <div class="wide">
                <label for="PROXY">代理</label>
                <input id="PROXY" name="PROXY" type="text" placeholder="http://127.0.0.1:7890" />
                <p class="hint" id="proxyHint">本机代理可填 127.0.0.1，容器里会自动转到宿主机</p>
              </div>
              <div>
                <label for="WEB_PASSWORD">面板密码</label>
                <input id="WEB_PASSWORD" name="WEB_PASSWORD" type="password" autocomplete="new-password" />
              </div>
              <div class="check">
                <input id="DEBUG" name="DEBUG" type="checkbox" />
                <label for="DEBUG">开启调试日志</label>
              </div>
            </div>
            <div class="apply-row">
              <button class="primary" id="saveBtn" type="submit">
                <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                保存并生效
              </button>
              <div class="message" id="formMsg"></div>
            </div>
          </form>
        </div>
      </div>
    </div>

    <nav class="mobile-nav" aria-label="面板分区">
      <button class="nav-item active" type="button" data-panel="logs" id="navLogs">
        <svg viewBox="0 0 24 24"><path d="M8 6h13"></path><path d="M8 12h13"></path><path d="M8 18h13"></path><path d="M3 6h.01"></path><path d="M3 12h.01"></path><path d="M3 18h.01"></path></svg>
        日志
      </button>
      <button class="nav-item" type="button" data-panel="settings" id="navSettings">
        <span class="nav-badge" id="navSettingsBadge" hidden></span>
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        设置
      </button>
    </nav>
  </div>

  <script>
    const stateText = {
      stopped: "未启动",
      starting: "正在启动",
      running: "运行中",
      waiting_code: "等待验证码",
      waiting_password: "等待二次验证密码",
      exited: "已退出"
    };

    const fields = ["TELEGRAM_API_ID","TELEGRAM_API_HASH","BOT_TOKEN","ADMINS","PROXY","PHONE_NUMBER","WEB_PASSWORD"];
    let formDirty = false;
    let settingsLoaded = false;
    let logUpdatePaused = false;
    let pendingLogContent = null;
    let isAuthorized = false;
    let currentLogFilter = "ALL";
    let autoOpenedVerify = false;

    function isMobileLayout() {
      return window.matchMedia("(max-width: 768px)").matches;
    }

    function setPanel(panel) {
      const app = document.getElementById("app");
      if (!app || (panel !== "logs" && panel !== "settings")) return;
      app.dataset.panel = panel;
      document.querySelectorAll(".mobile-nav .nav-item").forEach((btn) => {
        btn.classList.toggle("active", btn.getAttribute("data-panel") === panel);
      });
    }

    document.querySelectorAll(".mobile-nav .nav-item").forEach((btn) => {
      btn.addEventListener("click", () => setPanel(btn.getAttribute("data-panel")));
    });
    document.getElementById("mobileVerifyTip").addEventListener("click", () => {
      setPanel("settings");
      const input = document.getElementById("verifyInput");
      if (input) input.focus();
    });
    window.addEventListener("resize", () => {
      if (!isMobileLayout()) {
        document.getElementById("app").classList.remove("needs-verify");
      }
    });

    document.querySelectorAll(".password-field").forEach((wrap) => {
      const input = wrap.querySelector("input");
      const toggle = wrap.querySelector(".password-toggle");
      if (!input || !toggle) return;
      toggle.addEventListener("click", () => {
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        toggle.classList.toggle("is-visible", show);
        toggle.title = show ? "隐藏密码" : "显示密码";
        toggle.setAttribute("aria-label", toggle.title);
      });
    });

    function isTextSelected() {
      const selection = window.getSelection();
      if (!selection || selection.rangeCount === 0) return false;
      const range = selection.getRangeAt(0);
      const logsElement = document.getElementById("logs");
      return logsElement && logsElement.contains(range.commonAncestorContainer) && !range.collapsed;
    }

    document.addEventListener("selectionchange", () => {
      const wasSelected = logUpdatePaused;
      logUpdatePaused = isTextSelected();

      const statusEl = document.getElementById("logStatus");
      if (logUpdatePaused) {
        statusEl.classList.add("paused");
        statusEl.innerHTML = isMobileLayout()
          ? '<span>已暂停</span>'
          : '<span>⏸</span><span>已暂停更新（选中文本时）</span>';
      } else {
        statusEl.classList.remove("paused");
        statusEl.innerHTML = '<span>实时更新</span>';
        if (wasSelected && pendingLogContent !== null) {
          updateLogs(pendingLogContent);
          pendingLogContent = null;
        }
      }
    });

    async function api(url, options) {
      const res = await fetch(url, Object.assign({ headers: { "Content-Type": "application/json" } }, options));
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.message || "请求失败");
      return data;
    }

    function fillSettings(settings, force) {
      if (!settings) return;
      if (!force && formDirty) return;
      fields.forEach((key) => {
        const el = document.getElementById(key);
        if (el) el.value = settings[key] || "";
      });
      document.getElementById("DEBUG").checked = settings.DEBUG === "1";
      settingsLoaded = true;
      if (force) formDirty = false;
    }

    function updateLogs(newContent) {
      if (logUpdatePaused) {
        pendingLogContent = newContent;
        return;
      }

      const logsEl = document.getElementById("logs");
      const shouldScrollToBottom = logsEl.scrollHeight - logsEl.scrollTop - logsEl.clientHeight < 50;
      const formatted = newContent.split("\n").map((line) => {
        if (!line.trim()) return "";
        const match = line.match(/^(\[[\d\-: ]+\])\s*(\[(ERROR|WARNING|SUCCESS|INFO|DEBUG)\])\s*(.*)$/);
        if (!match) return `<span class="log-line">${line}</span>`;
        const timestamp = match[1];
        const level = match[3];
        const message = match[4];
        const hidden = (currentLogFilter !== "ALL" && currentLogFilter !== level) ? " hidden" : "";
        return `<span class="log-line${hidden}" data-level="${level}"><span class="log-meta"><span class="log-timestamp">${timestamp}</span><span class="log-level ${level}">[${level}]</span></span><span class="log-msg">${message}</span></span>`;
      }).filter(Boolean).join("");

      logsEl.innerHTML = formatted;
      if (shouldScrollToBottom) logsEl.scrollTop = logsEl.scrollHeight;
    }

    function applyLogFilter(level) {
      currentLogFilter = level;
      document.querySelectorAll("#logs .log-line").forEach((line) => {
        const lineLevel = line.getAttribute("data-level");
        line.classList.toggle("hidden", !(level === "ALL" || lineLevel === level));
      });
      document.querySelectorAll(".filter-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.getAttribute("data-level") === level);
      });
    }

    function render(data, options) {
      options = options || {};

      if (data.authorized === false) {
        document.getElementById("login").classList.add("show");
        isAuthorized = false;
        settingsLoaded = false;
        formDirty = false;
        return;
      }

      if (data.authorized === true || isAuthorized) {
        isAuthorized = true;
        document.getElementById("login").classList.remove("show");
      }

      document.getElementById("logoutBtn").style.display = data.has_password ? "inline-flex" : "none";
      fillSettings(data.settings, options.forceSettings === true || !settingsLoaded);
      const pill = document.getElementById("statusPill");
      pill.className = "status " + (data.state || "stopped");
      const label = stateText[data.state] || data.state || "未启动";
      const statusLabel = (!isMobileLayout() && data.bot_username)
        ? (label + " " + data.bot_username)
        : label;
      document.getElementById("statusText").textContent = statusLabel;
      updateLogs(data.logs || "暂无日志");

      const verify = document.getElementById("verifyBand");
      const verifyInput = document.getElementById("verifyInput");
      const needsVerify = data.state === "waiting_code" || data.state === "waiting_password";
      const app = document.getElementById("app");
      const badge = document.getElementById("navSettingsBadge");
      if (needsVerify) {
        const isPassword = data.state === "waiting_password";
        verify.classList.add("show");
        document.getElementById("verifyTitle").textContent = data.waiting_prompt || "需要验证";
        document.getElementById("verifyLabel").textContent = isPassword ? "二次验证密码" : "验证码";
        document.getElementById("verifyHint").textContent = isPassword
          ? "账号已开启两步验证，请输入云密码以继续登录"
          : "请查收 Telegram 发来的登录验证码，输入后提交";
        verifyInput.type = isPassword ? "password" : "text";
        verifyInput.inputMode = isPassword ? "text" : "numeric";
        verifyInput.autocomplete = isPassword ? "current-password" : "one-time-code";
        verifyInput.placeholder = isPassword ? "请输入二次验证密码" : "请输入验证码";
        app.classList.add("needs-verify");
        badge.hidden = false;
        if (isMobileLayout() && !autoOpenedVerify) {
          setPanel("settings");
          autoOpenedVerify = true;
        }
      } else {
        verify.classList.remove("show");
        app.classList.remove("needs-verify");
        badge.hidden = true;
        autoOpenedVerify = false;
      }

      renderUpdate(data);
    }

    function renderUpdate(data) {
      const update = data && data.update;
      const chip = document.getElementById("updateChip");
      if (!update || !update.has_update || !update.latest) {
        chip.hidden = true;
        return;
      }
      chip.hidden = false;
      chip.textContent = isMobileLayout()
        ? "更新"
        : ("有新版本 v" + update.latest);
      chip.href = update.url || "https://github.com/kuke2733/tg-bot-dl/releases/latest";
    }

    async function refresh() {
      try {
        render(await api("/api/status"));
      } catch (err) {
        document.getElementById("formMsg").textContent = err.message;
      }
    }

    document.getElementById("form").addEventListener("input", () => { formDirty = true; });
    document.getElementById("form").addEventListener("change", () => { formDirty = true; });

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {};
      fields.forEach((key) => payload[key] = document.getElementById(key).value);
      payload.DEBUG = document.getElementById("DEBUG").checked;
      try {
        const data = await api("/api/settings", { method: "POST", body: JSON.stringify(payload) });
        document.getElementById("formMsg").textContent = data.message || "已保存";
        render(data, { forceSettings: true });
      } catch (err) {
        document.getElementById("formMsg").textContent = err.message;
      }
    });

    document.getElementById("startBtn").addEventListener("click", async () => {
      try { render(await api("/api/start", { method: "POST", body: "{}" })); }
      catch (err) { document.getElementById("formMsg").textContent = err.message; }
    });
    document.getElementById("stopBtn").addEventListener("click", async () => {
      try { render(await api("/api/stop", { method: "POST", body: "{}" })); }
      catch (err) { document.getElementById("formMsg").textContent = err.message; }
    });
    document.getElementById("verifyBtn").addEventListener("click", async () => {
      const text = document.getElementById("verifyInput").value;
      const verifyMsg = document.getElementById("verifyMsg");
      verifyMsg.className = "verify-msg";
      try {
        const data = await api("/api/input", { method: "POST", body: JSON.stringify({ text }) });
        document.getElementById("verifyInput").value = "";
        verifyMsg.textContent = data.message || "已提交";
        verifyMsg.classList.add("ok");
        render(data);
      } catch (err) {
        verifyMsg.textContent = err.message;
        verifyMsg.classList.add("error");
      }
    });
    document.getElementById("loginBtn").addEventListener("click", async () => {
      try {
        await api("/api/login", { method: "POST", body: JSON.stringify({ password: document.getElementById("loginPassword").value }) });
        document.getElementById("loginMsg").textContent = "";
        refresh();
      } catch (err) {
        document.getElementById("loginMsg").textContent = err.message;
      }
    });

    document.getElementById("loginPassword").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("loginBtn").click();
    });
    document.getElementById("verifyInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("verifyBtn").click();
    });
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      try { await api("/api/logout", { method: "POST", body: "{}" }); refresh(); }
      catch (err) { document.getElementById("formMsg").textContent = err.message; }
    });

    document.querySelectorAll(".filter-btn").forEach((btn) => {
      btn.addEventListener("click", () => applyLogFilter(btn.getAttribute("data-level")));
    });

    async function checkUpdate() {
      try {
        renderUpdate(await api("/api/update"));
      } catch (err) {}
    }

    refresh();
    checkUpdate();
    setInterval(refresh, 1500);
    setInterval(checkUpdate, 30 * 60 * 1000);
  </script>
</body>
</html>
